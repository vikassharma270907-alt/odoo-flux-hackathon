<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1b27"/>
      <stop offset="0.55" stop-color="#3a2234"/>
      <stop offset="1" stop-color="#17343a"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#714B67"/>
      <stop offset="1" stop-color="#017E84"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b6f90"/>
      <stop offset="1" stop-color="#2bb7bd"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- subtle glow blobs -->
  <circle cx="1080" cy="120" r="260" fill="#017E84" opacity="0.14"/>
  <circle cx="180" cy="640" r="240" fill="#714B67" opacity="0.18"/>
  <!-- top accent bar -->
  <rect x="0" y="0" width="1280" height="8" fill="url(#accent)"/>

  <!-- brand lockup -->
  <g transform="translate(72,70)">
    <rect width="78" height="78" rx="18" fill="url(#mark)" filter="url(#soft)"/>
    <text x="39" y="56" font-size="46" font-weight="800" fill="#fff" text-anchor="middle">B</text>
    <text x="98" y="54" font-size="40" font-weight="800" fill="#ffffff">Brightloop</text>
  </g>

  <!-- eyebrow -->
  <text x="74" y="212" font-size="23" font-weight="700" letter-spacing="5" fill="#53d2d8">SUBSCRIPTION BILLING · DONE RIGHT</text>

  <!-- headline -->
  <text x="70" y="312" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">Nothing is billed</text>
  <text x="70" y="410" font-size="96" font-weight="800" letter-spacing="-2">
    <tspan fill="#ffffff">twice. </tspan><tspan fill="#53d2d8">Ever.</tspan>
  </text>

  <!-- subline -->
  <text x="74" y="463" font-size="25" fill="#d9cdd6">Idempotent recurring invoicing on a</text>
  <text x="74" y="495" font-size="25" fill="#d9cdd6">real Node + PostgreSQL backend.</text>

  <!-- proof pills -->
  <g font-size="22" font-weight="700">
    <g transform="translate(74,530)">
      <rect width="250" height="52" rx="26" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="26" y="34" fill="#9be3c4">●</text>
      <text x="50" y="34" fill="#ffffff">429 → 0 on re-run</text>
    </g>
    <g transform="translate(344,530)">
      <rect width="210" height="52" rx="26" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="26" y="34" fill="#9be3c4">●</text>
      <text x="50" y="34" fill="#ffffff">47 tests pass</text>
    </g>
    <g transform="translate(574,530)">
      <rect width="250" height="52" rx="26" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="26" y="34" fill="#9be3c4">●</text>
      <text x="50" y="34" fill="#ffffff">Deployed live</text>
    </g>
  </g>

  <!-- big run-billing card, right side -->
  <g transform="translate(905,250)" filter="url(#soft)">
    <rect width="300" height="230" rx="22" fill="#ffffff"/>
    <text x="28" y="52" font-size="19" font-weight="700" fill="#64748b">POST /run-billing</text>
    <text x="28" y="150" font-size="120" font-weight="800" fill="#047857" letter-spacing="-4">429</text>
    <text x="28" y="192" font-size="19" fill="#64748b">invoices created</text>
    <g transform="translate(206,24)">
      <rect width="70" height="34" rx="17" fill="#dcfce7"/>
      <text x="35" y="23" font-size="16" font-weight="800" fill="#047857" text-anchor="middle">1st</text>
    </g>
  </g>
  <g transform="translate(965,500)" filter="url(#soft)">
    <rect width="240" height="150" rx="20" fill="#ffffff"/>
    <text x="26" y="46" font-size="17" font-weight="700" fill="#64748b">run it again</text>
    <text x="26" y="118" font-size="78" font-weight="800" fill="#b45309" letter-spacing="-3">0</text>
    <g transform="translate(150,22)">
      <rect width="72" height="32" rx="16" fill="#fef3c7"/>
      <text x="36" y="22" font-size="15" font-weight="800" fill="#b45309" text-anchor="middle">2nd</text>
    </g>
  </g>

  <!-- footer tag -->
  <text x="74" y="672" font-size="21" font-weight="600" fill="#b9a7b4">Odoo × FLUX Lucknow Hackathon '26 · brightloop-do6a.onrender.com</text>
</svg>
