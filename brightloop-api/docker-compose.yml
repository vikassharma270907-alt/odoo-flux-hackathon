services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: subscriptions }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20 }
    ports: ["5432:5432"]
  api:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/subscriptions
      JWT_SECRET: demo-secret-change-me
    command: sh -c "node db/seed.js --reset && node src/server.js"
    ports: ["3000:3000"]
